org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Gradle 8.x + Groovy cannot parse Java 25 class files, and the system default
# JDK moved to 25, so the daemon has to run on 17. Point JAVA_HOME at a JDK 17
# before ./gradlew, or pass -Dorg.gradle.java.home. Toolchains target 17 for the
# mod itself either way. (A pinned path used to live here, which meant every
# clone inherited one machine's JDK location.)

## Toolchain
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1
patchouli_version=1.20.1-84-FORGE

## Mod identity
mod_id=utilitymobs
mod_name=Utility Mobs
mod_license=GPL-3.0
mod_version=3.4.0
mod_group_id=toast.utilityMobs
mod_authors=FatherToast, xy
mod_description=Golems and turrets to protect your base. Port of FatherToast's Utility Mobs.
